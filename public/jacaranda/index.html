<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Jacaranda Quarter · the Palais</title>

    <!--
      A door on its own address: mollybeach.app/jacaranda opens the same room as
      mollybeach.app/#jacaranda, and carries its own picture and words for
      whoever it is sent to. A hash never reaches the crawlers at X, Facebook
      or iMessage, so each room has a page like this one instead.
    -->
    <meta name="description" content="French doors open onto an iron balcony over a cobbled street of purple jacaranda trees, gas lamps and a waterfront glowing pink at dusk." />
    <link rel="canonical" href="https://mollybeach.app/#jacaranda" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="the Palais · mollybeach.app" />
    <meta property="og:url" content="https://mollybeach.app/jacaranda" />
    <meta property="og:title" content="The Jacaranda Quarter · the Palais" />
    <meta property="og:description" content="French doors open onto an iron balcony over a cobbled street of purple jacaranda trees, gas lamps and a waterfront glowing pink at dusk." />
    <meta property="og:image" content="https://mollybeach.app/social-preview-jacaranda.jpg" />
    <meta property="og:image:secure_url" content="https://mollybeach.app/social-preview-jacaranda.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Jacaranda Quarter, a room in the Palais: night streets." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mollybeach.app/jacaranda" />
    <meta name="twitter:title" content="The Jacaranda Quarter · the Palais" />

    <meta name="twitter:image" content="https://mollybeach.app/social-preview-jacaranda.jpg" />
    <meta name="theme-color" content="#f3e4c8" />

    <!-- for anyone who opens it: on into the room. This is a script and not a
         <meta http-equiv="refresh">, which the crawlers follow — they would
         read the front page's tags instead of these. A reader with scripts off
         gets the link below. -->
    <script>
      location.replace("/#jacaranda" + location.search);
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3e4c8;
        color: #6b5320;
        font: 500 1rem/1.5 "Iowan Old Style", Palatino, Georgia, serif;
        text-align: center;
      }
      a { color: #9c7632; }
    </style>
  </head>
