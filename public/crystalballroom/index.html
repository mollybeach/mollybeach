    <title>The Crystal Ballroom · the Palais</title>

    <!--
      A door on its own address: mollybeach.app/crystalballroom opens the same room as
      mollybeach.app/#crystal, and carries its own picture and words for
      whoever it is sent to. A hash never reaches the crawlers at X, Facebook
      or iMessage, so each room has a page like this one instead.
    -->
    <meta name="description" content="The Crystal Ballroom at night: purple star curtains, crystal chandeliers over a mosaic marble floor, the band set up on stage, the bar, and a pool table that plays a beat." />
    <link rel="canonical" href="https://mollybeach.app/#crystal" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="the Palais · mollybeach.app" />
    <meta property="og:url" content="https://mollybeach.app/crystalballroom" />
    <meta property="og:title" content="The Crystal Ballroom · the Palais" />
    <meta property="og:description" content="The Crystal Ballroom at night: purple star curtains, crystal chandeliers over a mosaic marble floor, the band set up on stage, the bar, and a pool table that plays a beat." />

    <!-- for anyone who opens it: on into the room. This is a script and not a
         <meta http-equiv="refresh">, which the crawlers follow — they would
         read the front page's tags instead of these. A reader with scripts off
         gets the link below. -->
    <script>
      location.replace("/" + location.search + "#crystal");
