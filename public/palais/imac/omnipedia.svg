<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- omnipedia: an encyclopedia article read and graded sentence by sentence,
       each line highlighted by how well it checks out -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#162034"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- the article -->
  <rect x="112" y="84" width="288" height="352" rx="26" fill="#ffffff"/>
  <!-- its heading, in the red of an unsupported claim -->
  <rect x="140" y="116" width="150" height="38" rx="8" fill="#fbcfd3"/>
  <rect x="152" y="128" width="126" height="14" rx="7" fill="#1c1c1c"/>
  <!-- sentences: green, yellow, green, plain -->
  <rect x="140" y="182" width="232" height="30" rx="7" fill="#c9f2d6"/>
  <rect x="150" y="192" width="200" height="10" rx="5" fill="#3a3a3a"/>
  <rect x="140" y="226" width="232" height="30" rx="7" fill="#fdf1a8"/>
  <rect x="150" y="236" width="176" height="10" rx="5" fill="#3a3a3a"/>
  <rect x="140" y="270" width="232" height="30" rx="7" fill="#c9f2d6"/>
  <rect x="150" y="280" width="208" height="10" rx="5" fill="#3a3a3a"/>
  <rect x="150" y="324" width="190" height="10" rx="5" fill="#9a9a9a"/>
  <rect x="150" y="350" width="150" height="10" rx="5" fill="#9a9a9a"/>
  <!-- the reviewer's lens, over the corner -->
  <circle cx="362" cy="364" r="62" fill="rgba(255,255,255,0.25)" stroke="#1f6fd1" stroke-width="20"/>
  <path d="M406 408L446 448" stroke="#1f6fd1" stroke-width="30" stroke-linecap="round"/>
  <path d="M334 364l20 20 36-40" fill="none" stroke="#1f9d55" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
