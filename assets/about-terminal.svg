<svg xmlns="http://www.w3.org/2000/svg" width="860" height="174" viewBox="0 0 860 174" role="img" aria-label="Conventional résumé: experience, projects, skills, education, awards and certifs. The Palais: interactive, Versailles-style palace terrace, built entirely from hand-made stickers rendered across all 4 seasons. Atlas Map: explorable world of rooms.">
<defs>
  <filter id="glow" x="-5%" y="-30%" width="110%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".28"/></pattern>
  <radialGradient id="screen" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0d2414"/><stop offset="1" stop-color="#050c07"/></radialGradient>
</defs>
<rect x="1.5" y="1.5" width="857" height="171" rx="26" fill="url(#screen)" stroke="#1f9e48" stroke-width="3"/>
<rect x="9" y="9" width="842" height="156" rx="20" fill="none" stroke="#3dff7a" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="7 5"/>
<g font-family="'Roboto Mono','SF Mono',SFMono-Regular,Menlo,Consolas,ui-monospace,monospace" font-size="15.5" filter="url(#glow)">
<text x="30" y="40" xml:space="preserve"><tspan fill="#1f9e48" font-weight="700">$ </tspan><tspan fill="#3dff7a" font-weight="500">cat about.txt</tspan></text>
<text x="30" y="66" xml:space="preserve"><tspan fill="#1f9e48" font-weight="700">&gt; </tspan><tspan fill="#c8ffd4" font-weight="700">Conventional résumé</tspan><tspan fill="#3dff7a" font-weight="500">: experience, projects, skills, education, awards &amp; certifs.</tspan></text>
<text x="30" y="92" xml:space="preserve"><tspan fill="#1f9e48" font-weight="700">&gt; </tspan><tspan fill="#c8ffd4" font-weight="700">the Palais</tspan><tspan fill="#3dff7a" font-weight="500">: interactive, Versailles-style palace terrace, built entirely</tspan></text>
<text x="30" y="118" xml:space="preserve"><tspan fill="#1f9e48" font-weight="700">  </tspan><tspan fill="#3dff7a" font-weight="500">from hand-made stickers rendered across all 4 seasons.</tspan></text>
<text x="30" y="144" xml:space="preserve"><tspan fill="#1f9e48" font-weight="700">&gt; </tspan><tspan fill="#c8ffd4" font-weight="700">Atlas Map</tspan><tspan fill="#3dff7a" font-weight="500">: explorable world of rooms.</tspan></text>
<rect x="396.70000000000005" y="131" width="9" height="16" fill="#3dff7a">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
